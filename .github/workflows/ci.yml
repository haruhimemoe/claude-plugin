name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: validate skills
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Validate
        run: node scripts/validate.mjs

      # Claude Code's own manifest check (no auth needed). Pinned so a CLI release can't turn CI
      # red on its own; bump it on purpose.
      - name: Validate manifests
        run: npx -y @anthropic-ai/claude-code@2.1.280 plugin validate . --strict
