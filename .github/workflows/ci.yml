name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate skills
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Validate skills
        run: node scripts/validate.mjs

      # Claude Code's own checks (no auth needed): the marketplace at the root, then the plugin.
      # Pinned so a CLI release can't turn CI red on its own; bump it on purpose.
      - name: Validate marketplace
        run: npx -y @anthropic-ai/claude-code@2.1.280 plugin validate . --strict

      - name: Validate plugin
        run: npx -y @anthropic-ai/claude-code@2.1.280 plugin validate plugins/haruhime --strict
